version: '3'

services:

  postgres:
    image : 'postgres:14.0'
    container_name: postgres
    ports:
      - "${POSTGRES_PORT}:5432"
    restart: always
    deploy:
      mode: replicated
      replicas: 1
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: 
      - ./db-data/postgres/:/var/lib/postgresql/data
    networks:
      - vnexpress_project_nw

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin-container
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    networks:
      - vnexpress_project_nw

  crawl-sv:
    build:
      context: ./crawl-service
      dockerfile: crawl-service.Dockerfile
    container_name: crawl-sv
    restart: always
    ports:
      - "${CRAWL_SERVICE_PORT}:8080"
    depends_on:
      - postgres
    environment:
      DSN: "host=${POSTGRES_HOST} port=${POSTGRES_PORT} user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} dbname=${POSTGRES_DB} sslmode=disable timezone=UTC connect_timeout=5"
    networks:
      - vnexpress_project_nw

  article_sv:
    build:
      context: ./article-service
      dockerfile: article-service.Dockerfile
    container_name: article_sv
    restart: always
    ports:
      - "${ARTICLE_SERVICE_PORT}:9090"
    depends_on:
      - postgres
    environment:
      DSN: "host=${POSTGRES_HOST} port=${POSTGRES_PORT} user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} dbname=${POSTGRES_DB} sslmode=disable timezone=UTC connect_timeout=5"
    networks:
      - vnexpress_project_nw
  # jenkins:
  #   image: jenkins/jenkins:lts
  #   container_name: jenkins
  #   restart: always
  #   privileged: true
  #   user: root
  #   ports:
  #     - "9595:8080"
  #     - "50000:50000"
  #   volumes:
  #     - jenkins_home:/var/jenkins_home
  #     - /var/run/docker.sock:/var/run/docker.sock
  #   environment:
  #     - JAVA_OPTS=-Djenkins.install.runSetupWizard=false

  elasticsearch:
    container_name: es-container
    image: docker.elastic.co/elasticsearch/elasticsearch:8.5.0 
    environment:
      - xpack.security.enabled=false
      - "discovery.type=single-node"
    networks:
      - vnexpress_project_nw
    ports:
      - 9200:9200
  kibana:
    container_name: kb-container
    image: docker.elastic.co/kibana/kibana:8.5.0 
    environment:
      - ELASTICSEARCH_HOSTS=http://es-container:9200
    networks:
      - vnexpress_project_nw
    depends_on:
      - elasticsearch
    ports:
      - 5601:5601

volumes:
  jenkins_home:
    driver: local
    
networks:
  vnexpress_project_nw:
    driver: bridge


